# vyos-pi: systemd keeps the hardware watchdog (Pi: bcm2835-wdt, whose longest
# timeout is 15 s) fed while PID 1 runs. On the Pi 5 the firmware starts the
# watchdog before the kernel (config.txt kernel_watchdog_timeout) and the
# kernel feeds it until systemd opens it (watchdog.open_timeout), so a boot
# that hangs anywhere from the kernel on resets the board. Without a watchdog
# device (VMs) this does nothing.
[Manager]
RuntimeWatchdogSec=15
