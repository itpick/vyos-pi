# vyos-pi: start Suricata in IDS (af-packet, VyOS's own mode) or IPS
# (NFQUEUE) mode, as /config/vyos-pi/suricata.conf says. Replaces the
# ExecStart of VyOS's 10-override.conf; see /usr/libexec/vyos-pi/suricata-start.
[Service]
ExecStart=
ExecStart=/usr/libexec/vyos-pi/suricata-start start
ExecStopPost=/usr/libexec/vyos-pi/suricata-start stop
